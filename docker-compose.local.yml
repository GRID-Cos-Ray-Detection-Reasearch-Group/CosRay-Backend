volumes:
  local_iotdb_data: {}
  local_redis_data: {}

services:
  django:
    build:
      context: .
      dockerfile: ./compose/local/django/Dockerfile
    image: cosray_backend_local_django
    container_name: cosray_backend_local_django
    depends_on:
      postgres:
        condition: service_healthy
      iotdb:
        condition: service_started
      redis:
        condition: service_started
    volumes:
      # 保留虚拟环境在容器内，避免本地和容器冲突
      - /workspace/.venv
      # 挂载代码到单独目录，避免覆盖容器内虚拟环境
      - .:/workspace:z
    working_dir: /workspace
    env_file:
      - .envs/.local/.django
      - .envs/.local/.postgres
    ports:
      - "8000:8000"
    command: /start
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  postgres:
    image: docker.io/library/postgres:18
    container_name: cosray_backend_local_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: cosray
      POSTGRES_USER: cosray
      POSTGRES_PASSWORD: cosray
    ports:
      - "5432:5432"
    volumes:
      - ${DATA_ROOT:-/data/cosray}/postgres:/var/lib/postgresql/data
      - ${DATA_ROOT:-/data/cosray}/postgres_backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cosray -d cosray"]
      interval: 5s
      timeout: 5s
      retries: 5

  iotdb:
    image: docker.io/apache/iotdb:2.0.7-standalone
    container_name: cosray_backend_local_iotdb
    restart: unless-stopped
    ports:
      - "6667:6667"
      - "6668:6668"
    environment:
      - IOTDB_USERNAME=root
      - IOTDB_PASSWORD=root
      - dn_rpc_address=0.0.0.0
      - dn_rpc_port=6667
      - dn_internal_address=127.0.0.1
    volumes:
      - local_iotdb_data:/iotdb/data

  redis:
    image: redis:8-alpine
    container_name: cosray_backend_local_redis
    restart: unless-stopped
    env_file:
      - .envs/.local/.redis
    command: sh -c 'redis-server --appendonly yes --requirepass "$${REDIS_PASSWORD}"'
    ports:
      - "6379:6379"
    volumes:
      - local_redis_data:/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'redis-cli -a "$${REDIS_PASSWORD}" ping | grep PONG || exit 1',
        ]
      interval: 10s
      timeout: 5s
      retries: 5
