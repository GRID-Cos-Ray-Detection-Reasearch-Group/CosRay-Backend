[project]
name = "cosray-backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "apache-iotdb>=2.0.6",
    "django>=6.0.1",
    "django-cors-headers>=4.9.0",
    "django-environ>=0.12.0",
    "django-ninja>=1.5.3",
    "django-ninja-jwt>=5.4.4",
    "django-unfold>=0.77.1",
    "gunicorn>=25.1.0",
    "psycopg2-binary>=2.9.11",
    "python-dotenv>=1.2.1",
    "uvicorn>=0.41.0",
    "whitenoise>=6.11.0",
]

[dependency-groups]
dev = [
    "django-stubs>=5.2.9",
    "mypy>=1.19.1",
    "pillow>=11.3.0",
    "pre-commit>=4.5.1",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-django>=4.11.1",
    "testcontainers>=4.13.1",
    "ruff>=0.14.14",
]

[tool.ruff]
target-version = "py313"
line-length = 119
# Exclude the template content as most files aren't parseable
extend-exclude = ["docs/*", "*/migrations/*"]

lint.select = [
    "A",
    # "ANN", # flake8-annotations: we should support this in the future but many errors atm
    "ASYNC",
    "B",
    "BLE",
    "C4",
    "C90",
    "COM",
    "DTZ",
    "E",
    "EM",
    "ERA",
    "EXE",
    "F",
    "FA",
    "FBT",
    "FLY",
    "G",
    "I",
    "ICN",
    "INP",
    "INT",
    "ISC",
    "N",
    "PD",
    "PERF",
    "PGH",
    "PIE",
    "PL",
    "PT",
    # "ARG", # Unused function argument
    "PTH",
    "PYI",
    "Q",
    "RET",
    "RSE",
    # "FURB",
    # "LOG",
    "RUF",
    "S",
    "SIM",
    "SLF",
    "SLOT",
    "T10",
    "TC",
    "TID",
    "TRY",
    "UP",
    "W",
    "YTT",
]
lint.ignore = [
    "COM812", # Trailing comma missing - conflicts with formatter
    "EM101",
    "RUF012", # Mutable class attributes should be annotated with `typing.ClassVar`
    "S101",   # Use of assert detected https://docs.astral.sh/ruff/rules/assert/
    "SIM102", # sometimes it's better to nest
    "TRY003", # Avoid specifying long messages outside the exception class
    "PT009",  # Use a regular assert instead of unittest-style assertEqual
    "PLR2004",# Magic value used in comparison
    "PLR0911",# Too many return statements
    "S105",   # Possible hardcoded password assigned
    "S106",   # Possible hardcoded password argument
    "RUF002", # Ambiguous unicode character in docstring
    "RUF003", # Ambiguous unicode character in comment
]
lint.isort.force-single-line = true

[tool.pyproject-fmt]
keep_full_version = true

# ==== pytest ====

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py", "*_test.py"]
addopts = "-v --tb=short --reuse-db"
norecursedirs = [".tox", ".git", "*/migrations/*", "*/static/*", "docs", "venv"]

# ==== djLint ====

[tool.djlint]
blank_line_after_tag = "load,extends"
close_void_tags = true
format_css = true
format_js = true
# TODO: remove T002 when fixed https://github.com/Riverside-Healthcare/djLint/issues/687
ignore = "H006,H030,H031,T002,T028"
ignore_blocks = "raw"
include = "H017,H035"
indent = 2
max_line_length = 119
profile = "jinja"

[tool.djlint.css]
indent_size = 2

[tool.djlint.js]
indent_size = 2

# ==== mypy ====

[tool.mypy]
python_version = "3.13"

plugins = ["mypy_django_plugin.main"]

strict = true
ignore_missing_imports = true

[tool.django-stubs]
django_settings_module = "config.settings"
