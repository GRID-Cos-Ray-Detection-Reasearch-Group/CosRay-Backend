volumes:
  production_postgres_data_backups: {}
  production_iotdb_data: {}
  production_redis_data: {}
  production_django_media: {}
  production_django_static: {}
  production_traefik: {}

services:
  django:
    image: ${DJANGO_IMAGE:-cosray_backend_production_django}
    build:
      context: .
      dockerfile: ./compose/production/django/Dockerfile
    container_name: cosray_backend_production_django
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      iotdb:
        condition: service_started
      redis:
        condition: service_started
    volumes:
      - ${DATA_ROOT:-/data/cosray}/media:/app/media
      - ${DATA_ROOT:-/data/cosray}/staticfiles:/app/staticfiles
    env_file:
      - .envs/.production/.django
      - .envs/.production/.postgres
    command: /start
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -f -H 'X-Forwarded-Proto: https' http://localhost:5000/api/health || exit 1",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  postgres:
    image: postgres:18
    container_name: cosray_backend_production_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: cosray
      POSTGRES_USER: cosray
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-please-change-this-postgres-password}
    volumes:
      - ${DATA_ROOT:-/data/cosray}/postgres:/var/lib/postgresql/data
      - ${DATA_ROOT:-/data/cosray}/postgres_backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cosray -d cosray"]
      interval: 5s
      timeout: 5s
      retries: 5

  iotdb:
    image: apache/iotdb:2.0.7-standalone
    container_name: cosray_backend_production_iotdb
    restart: unless-stopped
    environment:
      - dn_rpc_address=0.0.0.0
      - dn_rpc_port=6667
      - dn_internal_address=127.0.0.1
    volumes:
      - ${DATA_ROOT:-/data/cosray}/iotdb:/iotdb/data

  redis:
    image: redis:8-alpine
    container_name: cosray_backend_production_redis
    restart: unless-stopped
    env_file:
      - .envs/.production/.redis
    command: sh -c 'redis-server --appendonly yes --requirepass "$${REDIS_PASSWORD}"'
    volumes:
      - ${DATA_ROOT:-/data/cosray}/redis:/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'redis-cli -a "$${REDIS_PASSWORD}" ping | grep PONG || exit 1',
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  traefik:
    build:
      context: .
      dockerfile: ./compose/production/traefik/Dockerfile
    image: cosray_backend_production_traefik
    container_name: cosray_backend_production_traefik
    depends_on:
      - django
    volumes:
      - ${DATA_ROOT:-/data/cosray}/traefik_acme:/etc/traefik/acme
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - "80:80"
      - "443:443"

  nginx:
    build:
      context: .
      dockerfile: ./compose/production/nginx/Dockerfile
    image: cosray_backend_production_nginx
    container_name: cosray_backend_production_nginx
    restart: unless-stopped
    environment:
      NGINX_ENTRYPOINT_LOCAL_RESOLVERS: "1"
    depends_on:
      django:
        condition: service_healthy
    volumes:
      - ${DATA_ROOT:-/data/cosray}/media:/usr/share/nginx/media:ro
      - ${DATA_ROOT:-/data/cosray}/staticfiles:/usr/share/nginx/static:ro
    healthcheck:
      test:
        ["CMD-SHELL", "wget -q --spider http://127.0.0.1/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  # 监控服务
  dozzle:
    image: amir20/dozzle:latest
    container_name: cosray_backend_production_dozzle
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.dozzle.rule=Host(`${DOZZLE_HOST:-dozzle.cosray.top}`)"
      - "traefik.http.routers.dozzle.entrypoints=websecure"
      - "traefik.http.routers.dozzle.tls=true"
      - "traefik.http.routers.dozzle.tls.certresolver=letsencrypt"
      - "traefik.http.services.dozzle.loadbalancer.server.port=8080"
      - "traefik.http.middlewares.dozzle-auth.basicauth.users=${DOZZLE_BASIC_AUTH}"
      - "traefik.http.routers.dozzle.middlewares=dozzle-auth"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      - DOZZLE_NO_ANALYTICS=true
      - DOZZLE_LEVEL=info
      - DOZZLE_TAIL_SIZE=300

  # Uptime Kuma 状态监控与报警
  uptime-kuma:
    image: louislam/uptime-kuma:2-rootless
    container_name: cosray_backend_production_uptime_kuma
    restart: unless-stopped
    volumes:
      # 将数据挂载出来，防止容器重启后丢失监控记录
      - ${DATA_ROOT:-/data/cosray}/uptime_kuma:/app/data
    labels:
      - "traefik.enable=true"
      # 可以在 .env 中设置 UPTIME_KUMA_HOST 来覆盖默认的 status.cosray.top
      - "traefik.http.routers.uptime-kuma.rule=Host(`${UPTIME_KUMA_HOST:-status.cosray.top}`)"
      - "traefik.http.routers.uptime-kuma.entrypoints=websecure"
      - "traefik.http.routers.uptime-kuma.tls=true"
      - "traefik.http.routers.uptime-kuma.tls.certresolver=letsencrypt"
      # Uptime Kuma 容器内部默认监听 3001 端口
      - "traefik.http.services.uptime-kuma.loadbalancer.server.port=3001"
