name: Deploy

on:
  workflow_run:
    workflows:
      - CI
    branches:
      - main
    types:
      - completed
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  deploy:
    if: ${{ github.repository == 'GRID-Cos-Ray-Detection-Reasearch-Group/CosRay-Backend' && (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success') }}
    runs-on: ubuntu-latest
    environment: deploy
    env:
      IMAGE_NAME: ghcr.io/grid-cos-ray-detection-reasearch-group/cosray-backend-django
      IMAGE_TAG: ${{ github.event.workflow_run.head_sha || github.sha }}
      IMAGE_ARCHIVE_NAME: cosray-backend-django-image.tar.gz
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Django Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./compose/production/django/Dockerfile
          load: true
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
            ${{ env.IMAGE_NAME }}:main
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Export Django Image Archive
        run: docker save "${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}" | gzip > "${{ runner.temp }}/${{ env.IMAGE_ARCHIVE_NAME }}"

      - name: Copy Django Image Archive to Server
        uses: appleboy/scp-action@v0.1.7
        env:
          SERVER_APP_DIR: ${{ secrets.SERVER_APP_DIR }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: 22
          source: ${{ runner.temp }}/${{ env.IMAGE_ARCHIVE_NAME }}
          target: ${{ secrets.SERVER_APP_DIR }}/.deploy-artifacts

      - name: Deploy on Server
        uses: appleboy/ssh-action@v1.2.0
        env:
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
          IMAGE_TAG: ${{ env.IMAGE_TAG }}
          IMAGE_ARCHIVE_NAME: ${{ env.IMAGE_ARCHIVE_NAME }}
          SERVER_APP_DIR: ${{ secrets.SERVER_APP_DIR }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: 22
          envs: IMAGE_NAME,IMAGE_TAG,IMAGE_ARCHIVE_NAME,SERVER_APP_DIR
          script_stop: true
          script: |
            set -euo pipefail

            log() {
              printf '[deploy] %s\n' "$1"
            }

            locate_archive() {
              find .deploy-artifacts -type f -name "${IMAGE_ARCHIVE_NAME}" | head -n 1
            }

            cleanup() {
              rm -f ".deploy-artifacts/${IMAGE_ARCHIVE_NAME}" ".deploy-artifacts/django-image.tar"
              find .deploy-artifacts -mindepth 1 -maxdepth 3 -type d -empty -delete || true
            }

            print_diagnostics() {
              log "部署失败，输出最近的容器状态"
              docker compose -f docker-compose.production.yml ps || true
              log "输出 django 最近日志"
              docker compose -f docker-compose.production.yml logs --tail=200 django || true
            }

            trap cleanup EXIT
            trap print_diagnostics ERR

            cd "${SERVER_APP_DIR}"

            export DJANGO_IMAGE="${IMAGE_NAME}:${IMAGE_TAG}"
            log "准备部署目录"
            mkdir -p .deploy-artifacts
            ARCHIVE_PATH="$(locate_archive)"
            if [ -z "${ARCHIVE_PATH}" ]; then
              log "未找到镜像归档，输出部署目录内容"
              find .deploy-artifacts -maxdepth 3 -mindepth 1 | sort || true
              exit 1
            fi
            log "解压镜像归档"
            gzip -dc "${ARCHIVE_PATH}" > ".deploy-artifacts/django-image.tar"
            log "导入 Django 镜像"
            docker load --input ".deploy-artifacts/django-image.tar"
            log "启动编排服务"
            docker compose -f docker-compose.production.yml up -d --remove-orphans
            log "执行健康检查"
            docker compose -f docker-compose.production.yml exec -T django curl -f http://127.0.0.1:5000/api/health
            log "清理悬空镜像"
            docker image prune -f
