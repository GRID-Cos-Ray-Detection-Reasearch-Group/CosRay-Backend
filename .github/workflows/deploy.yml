name: Deploy

on:
  workflow_run:
    workflows:
      - CI
    branches:
      - main
      - dev # FIXME: 上线后需要改成 main 分支
    types:
      - completed
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  deploy:
    if: ${{ github.repository == 'GRID-Cos-Ray-Detection-Reasearch-Group/CosRay-Backend' && (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success') }}
    runs-on: ubuntu-latest
    environment: deploy
    env:
      IMAGE_NAME: ghcr.io/grid-cos-ray-detection-reasearch-group/cosray-backend-django
      IMAGE_TAG: ${{ github.event.workflow_run.head_sha || github.sha }}
      IMAGE_ARCHIVE_NAME: cosray-backend-images.tar.gz # 改为统称
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 1. 构建 Django 镜像 (利用 buildx 缓存)
      - name: Build Django Image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./compose/production/django/Dockerfile
          load: true
          tags: ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 2. 在 Actions 环境本地构建 Nginx 和 Traefik
      - name: Build Nginx and Traefik Images
        run: |
          docker build -t cosray_backend_production_nginx -f ./compose/production/nginx/Dockerfile .
          docker build -t cosray_backend_production_traefik -f ./compose/production/traefik/Dockerfile .

      # 3. 将所有自定义镜像打包成一个归档文件
      - name: Export All Images to Archive
        run: |
          docker save \
            "${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}" \
            cosray_backend_production_nginx \
            cosray_backend_production_traefik \
            | gzip > "${{ runner.temp }}/${{ env.IMAGE_ARCHIVE_NAME }}"

      # 4. 只传输必要的编排文件到服务器
      - name: Copy Compose file to Server
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: 22
          source: "docker-compose.production.yml" # 只需要这一个文件，无需发送 Dockerfile
          target: ${{ secrets.SERVER_APP_DIR }}

      # 5. 传输镜像压缩包
      - name: Copy Images Archive to Server
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: 22
          source: ${{ runner.temp }}/${{ env.IMAGE_ARCHIVE_NAME }}
          target: ${{ secrets.SERVER_APP_DIR }}/.deploy-artifacts
          strip_components: 2

      # 6. 在服务器上执行部署
      - name: Deploy on Server
        uses: appleboy/ssh-action@v1.2.5
        env:
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
          IMAGE_TAG: ${{ env.IMAGE_TAG }}
          IMAGE_ARCHIVE_NAME: ${{ env.IMAGE_ARCHIVE_NAME }}
          SERVER_APP_DIR: ${{ secrets.SERVER_APP_DIR }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: 22
          envs: IMAGE_NAME,IMAGE_TAG,IMAGE_ARCHIVE_NAME,SERVER_APP_DIR
          script_stop: true
          script: |
            set -euo pipefail

            log() { printf '[deploy] %s\n' "$1"; }

            cleanup() {
              rm -f ".deploy-artifacts/${IMAGE_ARCHIVE_NAME}" ".deploy-artifacts/images.tar"
              find .deploy-artifacts -mindepth 1 -maxdepth 3 -type d -empty -delete || true
            }

            trap cleanup EXIT

            cd "${SERVER_APP_DIR}"
            export DJANGO_IMAGE="${IMAGE_NAME}:${IMAGE_TAG}"

            log "解压并导入所有镜像 (Django, Nginx, Traefik)..."
            gzip -dc ".deploy-artifacts/${IMAGE_ARCHIVE_NAME}" > ".deploy-artifacts/images.tar"
            docker load --input ".deploy-artifacts/images.tar"

            log "启动编排服务 (纯离线启动)..."
            # 移除 --build 和 pull 动作，完全使用刚才 load 进去的本地镜像
            docker compose -f docker-compose.production.yml up -d --remove-orphans

            log "执行健康检查..."
            docker compose -f docker-compose.production.yml exec -T django curl -f http://127.0.0.1:5000/api/health

            log "清理旧镜像..."
            docker image prune -f
