name: CI

on:
  push:
    paths:
      - ".github/workflows/**"
      - "core/**"
      - "config/**"
      - "manage.py"
      - "pyproject.toml"
      - "uv.lock"
      - "compose/**"
      - "docker-compose.*.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v6

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: "pyproject.toml"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run Ruff (Linter & Formatter)
        run: uv run ruff check . && uv run ruff format --check .

  test:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: "sqlite:///db.sqlite3"
      REDIS_URL: "redis://redis:6379/0"
      DJANGO_SETTINGS_MODULE: config.settings
    services:
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping || exit 1"
          --health-interval 5s
          --health-timeout 2s
          --health-retries 5
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v6

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: "pyproject.toml"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Check Migrations
        run: uv run python manage.py makemigrations --check

      - name: Run DB Migrations
        run: |
          # 等待 Redis 服务就绪（通过简单的 bash 循环重试连接）
          for i in $(seq 1 30); do
            if nc -z redis 6379 >/dev/null 2>&1; then
              echo "redis ready"
              break
            fi
            sleep 1
          done
          uv run python manage.py migrate

      - name: Run Pytest
        env:
          DJANGO_SETTINGS_MODULE: config.settings
        run: uv run pytest -v

  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v6

      - name: Test Docker Production Build
        run: docker compose -f docker-compose.local.yml build django
